<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Simple - Chargement Questions</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .section { background: white; margin: 10px 0; padding: 15px; border-radius: 5px; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
        button:hover { background: #45a049; }
        pre { background: #f9f9f9; padding: 10px; overflow-x: auto; border: 1px solid #ddd; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🧪 Test Simple de Chargement</h1>
    
    <div class="section">
        <h3>Étape 1 : Charger le fichier</h3>
        <button onclick="testLoad()">Charger MACRO_QUESTIONS_COMPLETE_v2.txt</button>
        <div id="load-result"></div>
    </div>
    
    <div class="section">
        <h3>Étape 2 : Analyser les topics</h3>
        <button onclick="analyzeTopics()">Analyser les topics des questions</button>
        <div id="topics-result"></div>
    </div>
    
    <div class="section">
        <h3>Étape 3 : Charger la structure JSON</h3>
        <button onclick="testStructure()">Charger MACRO_complete.json</button>
        <div id="structure-result"></div>
    </div>
    
    <div class="section">
        <h3>Étape 4 : Comparer tags JSON vs topics TXT</h3>
        <button onclick="compareTagsAndTopics()">Comparer</button>
        <div id="compare-result"></div>
    </div>
    
    <div class="section">
        <h3>Étape 5 : Simuler sélection d'une notion</h3>
        <label>ID Notion: <input type="text" id="notion-id" value="M0-I-1a" /></label>
        <button onclick="simulateSelect()">Sélectionner</button>
        <div id="select-result"></div>
    </div>

    <script type="module">
        import { parseText2Quiz } from './src/parser.ts';
        
        let allQuestions = [];
        let structure = null;
        
        window.testLoad = async function() {
            const result = document.getElementById('load-result');
            result.innerHTML = '<p>⏳ Chargement...</p>';
            
            try {
                const response = await fetch('/src/questions/S1/MACRO/MACRO_QUESTIONS_COMPLETE_v2.txt');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                allQuestions = parseText2Quiz(text);
                
                result.innerHTML = `
                    <p class="success">✅ ${allQuestions.length} questions chargées</p>
                    <p>Première question :</p>
                    <pre>${JSON.stringify(allQuestions[0], null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ ${error.message}</p>`;
            }
        };
        
        window.analyzeTopics = function() {
            const result = document.getElementById('topics-result');
            if (allQuestions.length === 0) {
                result.innerHTML = '<p class="error">❌ Chargez d\'abord les questions</p>';
                return;
            }
            
            const topicsMap = new Map();
            allQuestions.forEach(q => {
                const topics = q.topics || [];
                topics.forEach(topic => {
                    topicsMap.set(topic, (topicsMap.get(topic) || 0) + 1);
                });
            });
            
            const sorted = Array.from(topicsMap.entries()).sort((a, b) => b[1] - a[1]);
            
            result.innerHTML = `
                <p class="success">✅ ${topicsMap.size} topics uniques trouvés</p>
                <details open>
                    <summary>Top 20 topics</summary>
                    <pre>${sorted.slice(0, 20).map(([t, c]) => `${t}: ${c} questions`).join('\n')}</pre>
                </details>
            `;
        };
        
        window.testStructure = async function() {
            const result = document.getElementById('structure-result');
            result.innerHTML = '<p>⏳ Chargement...</p>';
            
            try {
                const response = await fetch('/src/database/structures/MACRO_complete.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                structure = await response.json();
                
                // Extraire toutes les notions
                const allNotions = [];
                structure.chapters.forEach(chapter => {
                    chapter.sections?.forEach(section => {
                        section.subsections?.forEach(subsection => {
                            subsection.notions?.forEach(notion => {
                                allNotions.push(notion);
                            });
                        });
                    });
                });
                
                result.innerHTML = `
                    <p class="success">✅ Structure chargée</p>
                    <p>${structure.chapters.length} chapitres, ${allNotions.length} notions</p>
                    <p>Première notion :</p>
                    <pre>${JSON.stringify(allNotions[0], null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ ${error.message}</p>`;
            }
        };
        
        window.compareTagsAndTopics = function() {
            const result = document.getElementById('compare-result');
            if (allQuestions.length === 0 || !structure) {
                result.innerHTML = '<p class="error">❌ Chargez d\'abord les questions ET la structure</p>';
                return;
            }
            
            // Extraire toutes les notions avec leurs tags
            const notions = [];
            structure.chapters.forEach(chapter => {
                chapter.sections?.forEach(section => {
                    section.subsections?.forEach(subsection => {
                        subsection.notions?.forEach(notion => {
                            notions.push({
                                id: notion.id,
                                name: notion.name,
                                tags: notion.tags || []
                            });
                        });
                    });
                });
            });
            
            // Pour chaque notion, compter les questions qui ont au moins un tag en commun
            const analysis = notions.slice(0, 10).map(notion => {
                const matchingQuestions = allQuestions.filter(q => {
                    const topics = q.topics || [];
                    return notion.tags.some(tag => topics.includes(tag));
                });
                
                return {
                    id: notion.id,
                    name: notion.name,
                    tags: notion.tags,
                    matchingQuestions: matchingQuestions.length
                };
            });
            
            result.innerHTML = `
                <p class="success">✅ Analyse des 10 premières notions</p>
                <details open>
                    <summary>Matching questions/tags</summary>
                    <pre>${JSON.stringify(analysis, null, 2)}</pre>
                </details>
            `;
        };
        
        window.simulateSelect = function() {
            const result = document.getElementById('select-result');
            const notionId = document.getElementById('notion-id').value.trim();
            
            if (allQuestions.length === 0 || !structure) {
                result.innerHTML = '<p class="error">❌ Chargez d\'abord les questions ET la structure</p>';
                return;
            }
            
            // Trouver la notion
            let targetNotion = null;
            structure.chapters.forEach(chapter => {
                chapter.sections?.forEach(section => {
                    section.subsections?.forEach(subsection => {
                        subsection.notions?.forEach(notion => {
                            if (notion.id === notionId) {
                                targetNotion = notion;
                            }
                        });
                    });
                });
            });
            
            if (!targetNotion) {
                result.innerHTML = `<p class="error">❌ Notion "${notionId}" non trouvée</p>`;
                return;
            }
            
            // Créer un Set de thèmes sélectionnés (comme dans app.ts)
            const selectedThemes = new Set(targetNotion.tags);
            
            // Filtrer les questions
            const filtered = allQuestions.filter(q => {
                const topics = q.topics || [];
                return topics.some(tag => selectedThemes.has(tag));
            });
            
            result.innerHTML = `
                <p class="success">✅ Simulation de sélection de "${targetNotion.name}"</p>
                <p><strong>Tags de la notion:</strong> ${JSON.stringify(targetNotion.tags)}</p>
                <p><strong>Questions trouvées:</strong> ${filtered.length}</p>
                ${filtered.length > 0 ? `
                    <details open>
                        <summary>Voir les 5 premières questions</summary>
                        <pre>${JSON.stringify(filtered.slice(0, 5).map(q => ({
                            question: q.question.substring(0, 60) + '...',
                            topics: q.topics
                        })), null, 2)}</pre>
                    </details>
                ` : '<p class="error">⚠️ Aucune question ne correspond à ces tags !</p>'}
            `;
        };
    </script>
</body>
</html>
