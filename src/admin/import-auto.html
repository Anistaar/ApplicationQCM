<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Automatique - Text2Quiz VIP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      font-size: 2rem;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #64748b;
      margin-bottom: 2rem;
    }

    .progress-container {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .progress-bar {
      background: #e2e8f0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .log-item {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-item.success {
      background: #dcfce7;
      color: #166534;
    }

    .log-item.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .log-item.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2rem;
    }

    .stat {
      text-align: center;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 8px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .continue-btn {
      background: #10b981;
      margin-top: 2rem;
    }

    .continue-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Import Automatique</h1>
    <p class="description">Importation des fichiers MEGA_COMPLET dans la base de données</p>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div id="log-container">
        <div class="log-item info">
          <span>⏳</span>
          <span>En attente du démarrage...</span>
        </div>
      </div>
    </div>

    <div class="stats" id="stats" style="display: none;">
      <div class="stat">
        <div class="stat-value" id="total-questions">0</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-subjects">0</div>
        <div class="stat-label">Matières</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-time">0s</div>
        <div class="stat-label">Durée</div>
      </div>
    </div>

    <button class="btn" id="start-btn" onclick="startImport()">
      🚀 Lancer l'import
    </button>

    <button class="btn continue-btn" id="continue-btn" onclick="goToApp()" style="display: none;">
      ✨ Accéder à l'application
    </button>
  </div>

  <script type="module">
    import { questionDB } from '../database/QuestionDatabase';
    import { importService } from '../database/ImportService';

    const MEGA_FILES = [
      { path: '../questions/S1/MACRO/MACRO_MEGA_COMPLET.txt', subject: 'MACRO', name: 'Macroéconomie' },
      { path: '../questions/S1/INSTIT/INSTIT_MEGA_COMPLET.txt', subject: 'INSTIT', name: 'Institutions' },
      { path: '../questions/S1/STATS/STATS_MEGA_COMPLET.txt', subject: 'STATS', name: 'Statistiques' },
      { path: '../questions/S1/RIAE/RIAE_MEGA_COMPLET.txt', subject: 'RIAE', name: 'Relations Internationales' },
      { path: '../questions/S1/HPE/HPE_MEGA_COMPLET.txt', subject: 'HPE', name: 'Histoire Pensée Éco' },
      { path: '../questions/S1/DROIT/DROIT_MEGA_COMPLET.txt', subject: 'DROIT', name: 'Droit' },
      { path: '../questions/S1/ANALYSE_ECO/ANALYSE_ECO_MEGA_COMPLET.txt', subject: 'ANALYSE_ECO', name: 'Analyse Économique' }
    ];

    let totalQuestions = 0;
    let totalTime = 0;
    const startTime = Date.now();

    function addLog(message, type = 'info') {
      const logContainer = document.getElementById('log-container');
      const logItem = document.createElement('div');
      logItem.className = `log-item ${type}`;
      
      const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⏳';
      logItem.innerHTML = `<span>${icon}</span><span>${message}</span>`;
      
      logContainer.appendChild(logItem);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function updateProgress(current, total) {
      const percentage = (current / total) * 100;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    function updateStats() {
      document.getElementById('total-questions').textContent = totalQuestions;
      document.getElementById('total-subjects').textContent = MEGA_FILES.length;
      document.getElementById('total-time').textContent = `${totalTime}s`;
      document.getElementById('stats').style.display = 'grid';
    }

    window.startImport = async function() {
      const startBtn = document.getElementById('start-btn');
      startBtn.disabled = true;
      startBtn.textContent = '⏳ Import en cours...';

      document.getElementById('log-container').innerHTML = '';
      addLog('Initialisation de la base de données...', 'info');

      try {
        await questionDB.init();
        addLog('✓ Base de données initialisée', 'success');

        for (let i = 0; i < MEGA_FILES.length; i++) {
          const file = MEGA_FILES[i];
          addLog(`Import de ${file.name} (${file.subject})...`, 'info');

          try {
            const response = await fetch(file.path);
            if (!response.ok) {
              throw new Error(`Fichier introuvable: ${file.path}`);
            }

            const text = await response.text();
            const result = await importService.importFromText(text, file.subject);

            totalQuestions += result.success;
            addLog(`✓ ${file.name}: ${result.success} questions importées`, 'success');

            if (result.errors.length > 0) {
              addLog(`⚠️ ${file.name}: ${result.errors.length} erreurs`, 'error');
            }

          } catch (error) {
            addLog(`✗ ${file.name}: ${error.message}`, 'error');
          }

          updateProgress(i + 1, MEGA_FILES.length);
        }

        totalTime = Math.round((Date.now() - startTime) / 1000);
        updateStats();

        addLog(`🎉 Import terminé! ${totalQuestions} questions importées`, 'success');
        
        startBtn.style.display = 'none';
        document.getElementById('continue-btn').style.display = 'block';

      } catch (error) {
        addLog(`❌ Erreur critique: ${error.message}`, 'error');
        startBtn.disabled = false;
        startBtn.textContent = '🔄 Réessayer';
      }
    };

    window.goToApp = function() {
      window.location.href = '../new-ui/index.html';
    };

    // Vérifier si des questions existent déjà
    window.addEventListener('load', async () => {
      try {
        await questionDB.init();
        const questions = await questionDB.getAllQuestions();
        
        if (questions.length > 0) {
          addLog(`ℹ️ ${questions.length} questions déjà présentes dans la base`, 'info');
          addLog('L\'import va ajouter ou remplacer les questions existantes', 'info');
        }
      } catch (error) {
        console.error('Erreur vérification:', error);
      }
    });
  </script>
</body>
</html>
